name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Swift contracts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift tests
        run: swift test

  extension:
    name: Extension contracts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check SafariExtension/Resources/background.js
          node --check SafariExtension/Resources/content.js
          node --check SafariExtension/Resources/popup.js
      - name: Validate manifest
        run: python3 -m json.tool SafariExtension/Resources/manifest.json >/dev/null
      - name: Enforce submission boundary
        run: |
          if git grep -n -E '\.submit\(|requestSubmit\(' -- App Sources SafariExtension; then
            echo "Programmatic form submission APIs are forbidden in CareerPilot runtime code."
            exit 1
          fi

      - name: Enforce external-runtime independence
        run: |
          LEGACY_RUNTIME="$(printf 'open%s' 'claw')"
          if git grep -n -i "$LEGACY_RUNTIME" -- App Sources SafariExtension Package.swift project.yml; then
            echo "CareerPilot runtime code must not restore the removed external runtime dependency."
            exit 1
          fi

  xcode:
    name: Generate and compile Xcode project
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Compile without signing
        run: |
          xcodebuild \
            -project CareerPilot.xcodeproj \
            -scheme CareerPilot \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/CareerPilotDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify embedded Safari extension
        run: |
          APP_PATH="$RUNNER_TEMP/CareerPilotDerivedData/Build/Products/Debug/CareerPilot.app"
          EXTENSION_PATH="$APP_PATH/Contents/PlugIns/CareerPilotExtension.appex"

          test -d "$EXTENSION_PATH"
          test -f "$EXTENSION_PATH/Contents/Resources/manifest.json"

          POINT_IDENTIFIER="$(plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - "$EXTENSION_PATH/Contents/Info.plist")"
          test "$POINT_IDENTIFIER" = "com.apple.Safari.web-extension"
