name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Swift contracts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift tests
        run: swift test

  extension:
    name: Extension contracts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check SafariExtension/Resources/background.js
          node --check SafariExtension/Resources/content.js
          node --check SafariExtension/Resources/popup.js
      - name: Validate manifest
        run: python3 -m json.tool SafariExtension/Resources/manifest.json >/dev/null
      - name: Enforce submission boundary
        run: |
          if grep -R -n -E '\.submit\(|requestSubmit\(' SafariExtension; then
            echo "Submission APIs are forbidden in the Safari extension."
            exit 1
          fi

  xcode:
    name: Generate and compile Xcode project
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Compile without signing
        run: |
          xcodebuild             -project CareerPilot.xcodeproj             -scheme CareerPilot             -configuration Debug             -destination 'platform=macOS'             CODE_SIGNING_ALLOWED=NO             build
