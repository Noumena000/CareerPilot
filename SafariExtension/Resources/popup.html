<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>CareerPilot</title>
</head>
<body>
  <main>
    <p class="eyebrow">CAREERPILOT</p>
    <h1>Review this job</h1>
    <p id="status">Check the native bridge before capturing page context.</p>
    <div class="actions">
      <button id="check" class="secondary">Check connection</button>
      <button id="capture">Capture page</button>
    </div>
    <label for="question">Ask about this application</label>
    <textarea id="question" rows="3" placeholder="Draft an answer about my relevant experience…"></textarea>
    <button id="ask">Ask CareerPilot</button>
    <div id="answer" class="answer" hidden></div>
    <p class="context-note">Résumé files are added through CareerPilot’s native résumé library.</p>
    <p class="boundary">CareerPilot cannot submit applications.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
